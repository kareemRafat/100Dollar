<!DOCTYPE html>

<html dir="rtl" lang="ar">

<head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link
        href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@700;800&amp;family=Inter:wght@400;500;600&amp;family=Cairo:wght@400;600;700&amp;display=swap"
        rel="stylesheet" />
    <link
        href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap"
        rel="stylesheet" />
    <script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "surface-dim": "#dadad8",
                        "on-primary": "#ffffff",
                        "on-error": "#ffffff",
                        "error": "#ba1a1a",
                        "on-surface": "#1a1c1b",
                        "primary-container": "#986d00",
                        "tertiary-fixed-dim": "#b5c8e0",
                        "surface-container-lowest": "#ffffff",
                        "surface-tint": "#7b5800",
                        "primary": "#785600",
                        "inverse-surface": "#2f3130",
                        "secondary-fixed-dim": "#c6c4df",
                        "on-secondary-fixed-variant": "#45455b",
                        "error-container": "#ffdad6",
                        "tertiary": "#4c5e72",
                        "surface-container": "#eeeeec",
                        "on-secondary-fixed": "#1a1a2e",
                        "on-tertiary-container": "#fdfcff",
                        "on-primary-container": "#fffbff",
                        "outline-variant": "#d3c4af",
                        "on-background": "#1a1c1b",
                        "tertiary-fixed": "#d1e4fc",
                        "on-tertiary": "#ffffff",
                        "on-secondary": "#ffffff",
                        "inverse-primary": "#f7bd48",
                        "primary-fixed-dim": "#f7bd48",
                        "on-tertiary-fixed": "#091d2e",
                        "outline": "#817563",
                        "on-tertiary-fixed-variant": "#36485c",
                        "surface-container-highest": "#e2e3e1",
                        "surface-bright": "#f9f9f7",
                        "surface": "#f9f9f7",
                        "secondary-container": "#e2e0fc",
                        "inverse-on-surface": "#f1f1ef",
                        "tertiary-container": "#64768b",
                        "on-error-container": "#93000a",
                        "primary-fixed": "#ffdea6",
                        "secondary-fixed": "#e2e0fc",
                        "on-primary-fixed": "#271900",
                        "secondary": "#5d5c74",
                        "surface-variant": "#e2e3e1",
                        "on-surface-variant": "#4f4535",
                        "on-primary-fixed-variant": "#5d4200",
                        "background": "#f9f9f7",
                        "surface-container-high": "#e8e8e6",
                        "on-secondary-container": "#63627a",
                        "surface-container-low": "#f4f4f2",
                        "deep-navy": "#1A1A2E",
                        "golden-gold": "#B8860B"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    "fontFamily": {
                        "headline": ["Plus Jakarta Sans", "Cairo"],
                        "body": ["Inter", "Cairo"],
                        "label": ["Inter", "Cairo"]
                    }
                },
            },
        }
    </script>
    <style>
        body {
            font-family: 'Cairo', sans-serif;
        }

        .glass-effect {
            background: #ffffff;
        }

        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
    </style>
</head>

<body class="bg-[#F8F9FA] text-on-surface overflow-hidden">
    <!-- Blurred Homepage Background Content -->
    <div class="fixed inset-0 z-0 overflow-hidden filter blur-xl opacity-20">
        <header
            class="flex flex-row-reverse justify-between items-center w-full px-6 py-4 max-w-7xl mx-auto bg-surface shadow-sm">
            <div class="text-2xl font-bold text-secondary-fixed">أفكار بـ 100 دولار</div>
            <nav class="hidden md:flex gap-8">
                <span class="text-on-surface-variant">الرئيسية</span>
                <span class="text-on-surface-variant">الأرشيف</span>
                <span class="text-on-surface-variant">الرعاة</span>
            </nav>
        </header>
        <main class="max-w-7xl mx-auto px-6 pt-20">
            <div class="grid grid-cols-1 md:grid-cols-3 gap-8">
                <div class="bg-surface-container-low h-80 rounded-xl p-8 border border-outline-variant/10">
                    <div class="w-12 h-12 bg-primary/10 rounded-full mb-6"></div>
                    <div class="h-6 bg-secondary-fixed/20 w-3/4 rounded mb-4"></div>
                </div>
                <div class="bg-surface-container-low h-80 rounded-xl p-8 border border-outline-variant/10"></div>
                <div class="bg-surface-container-low h-80 rounded-xl p-8 border border-outline-variant/10"></div>
            </div>
        </main>
    </div>
    <!-- Modal Overlay -->
    <div class="fixed inset-0 z-50 flex items-center justify-center p-4 sm:p-6 bg-deep-navy/10 backdrop-blur-sm">
        <!-- Redesigned OTP Modal -->
        <div
            class="relative w-full max-w-[440px] bg-white rounded-3xl shadow-sm border border-gray-100 p-8 sm:p-12 flex flex-col items-center">
            <!-- Close Button -->
            <button class="absolute top-6 left-6 text-gray-400 hover:text-deep-navy transition-colors">
                <span class="material-symbols-outlined" data-icon="close">close</span>
            </button>
            <!-- Brand Icon -->
            <div class="mb-8 p-5 bg-gray-50 rounded-full border border-gray-100">
                <span class="material-symbols-outlined text-golden-gold text-4xl" data-icon="verified_user"
                    style="font-variation-settings: 'FILL' 1;">verified_user</span>
            </div>
            <!-- OTP Step Content -->
            <div class="w-full" id="otp-step">
                <div class="text-center mb-10">
                    <h2 class="text-2xl font-bold font-headline text-deep-navy mb-3">تحقق من هويتك</h2>
                    <p class="text-gray-500 text-sm font-body leading-relaxed px-4">أدخل الرمز المكون من 6 أرقام المرسل
                        إلى <br /><span class="font-semibold text-deep-navy">user@example.com</span></p>
                </div>
                <!-- OTP Input Grid -->
                <div class="flex flex-row-reverse justify-center gap-3 mb-10" dir="ltr">
                    <input
                        class="w-12 h-16 text-center text-2xl font-bold bg-gray-50 border-gray-200 rounded-xl focus:ring-2 focus:ring-golden-gold focus:border-transparent transition-all text-deep-navy placeholder:text-gray-300"
                        maxlength="1" placeholder="-" type="text" />
                    <input
                        class="w-12 h-16 text-center text-2xl font-bold bg-gray-50 border-gray-200 rounded-xl focus:ring-2 focus:ring-golden-gold focus:border-transparent transition-all text-deep-navy placeholder:text-gray-300"
                        maxlength="1" placeholder="-" type="text" />
                    <input
                        class="w-12 h-16 text-center text-2xl font-bold bg-gray-50 border-gray-200 rounded-xl focus:ring-2 focus:ring-golden-gold focus:border-transparent transition-all text-deep-navy placeholder:text-gray-300"
                        maxlength="1" placeholder="-" type="text" />
                    <input
                        class="w-12 h-16 text-center text-2xl font-bold bg-gray-50 border-gray-200 rounded-xl focus:ring-2 focus:ring-golden-gold focus:border-transparent transition-all text-deep-navy placeholder:text-gray-300"
                        maxlength="1" placeholder="-" type="text" />
                    <input
                        class="w-12 h-16 text-center text-2xl font-bold bg-gray-50 border-gray-200 rounded-xl focus:ring-2 focus:ring-golden-gold focus:border-transparent transition-all text-deep-navy placeholder:text-gray-300"
                        maxlength="1" placeholder="-" type="text" />
                    <input
                        class="w-12 h-16 text-center text-2xl font-bold bg-gray-50 border-gray-200 rounded-xl focus:ring-2 focus:ring-golden-gold focus:border-transparent transition-all text-deep-navy placeholder:text-gray-300"
                        maxlength="1" placeholder="-" type="text" />
                </div>
                <!-- Action Button -->
                <button
                    class="w-full py-4.5 py-4 bg-golden-gold text-white rounded-xl font-bold text-lg shadow-sm hover:bg-[#A6790A] active:scale-[0.98] transition-all mb-8">
                    تأكيد التصويت
                </button>
                <!-- Timer and Resend -->
                <div class="flex flex-col items-center gap-4">
                    <div class="flex items-center gap-2 text-gray-500 text-sm">
                        <span class="material-symbols-outlined text-[18px]" data-icon="timer">timer</span>
                        <span>تنتهي صلاحية الرمز خلال: </span>
                        <span class="font-mono font-bold text-deep-navy">09:59</span>
                    </div>
                    <button
                        class="text-golden-gold font-bold text-sm hover:text-[#A6790A] transition-all flex items-center gap-1">
                        إعادة إرسال الرمز
                    </button>
                </div>
            </div>
        </div>
    </div>
    <!-- Background Decorative Elements -->
    <div class="fixed top-0 right-0 w-1/3 h-1/3 bg-golden-gold/5 rounded-full blur-[120px] -z-10"></div>
    <div class="fixed bottom-0 left-0 w-1/4 h-1/4 bg-deep-navy/5 rounded-full blur-[100px] -z-10"></div>
</body>

</html>
